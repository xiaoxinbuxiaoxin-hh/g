<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陈柏砚 · 数字媒体创作人 | Unity作品集</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, 'Segoe UI', monospace;
            background: linear-gradient(145deg, #e0eaf5 0%, #cbdbe9 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .portfolio-container {
            max-width: 1300px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(2px);
            border-radius: 2.5rem;
            padding: 1.8rem;
            box-shadow: 0 25px 45px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.3);
        }
        .hero {
            background: white;
            border-radius: 1.8rem;
            padding: 1.5rem 2rem;
            margin-bottom: 2rem;
            text-align: center;
            box-shadow: 0 10px 25px -8px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 2.4rem;
            background: linear-gradient(135deg, #1f4662, #2b6c9e);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .tag {
            display: inline-block;
            background: #eef3fc;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            margin: 0.3rem;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .game-wrapper {
            background: #0f212e;
            border-radius: 1.5rem;
            overflow: hidden;
            box-shadow: 0 20px 30px -10px black;
            border: 1px solid #2c5a7a;
        }
        iframe {
            width: 100%;
            height: 620px;
            border: none;
            display: block;
        }
        .footer-note {
            text-align: center;
            margin-top: 1.5rem;
            color: #1a2c3a;
            font-weight: 500;
        }
        @media (max-width: 700px) {
            .portfolio-container { padding: 1rem; }
            iframe { height: 460px; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
<div class="portfolio-container">
    <div class="hero">
        <h1>🎬 陈柏砚 · 数字媒体创作人</h1>
        <p style="margin: 0.8rem 0 0.2rem;">数字媒体技术 · 大三 | 游戏开发 · 视觉设计 · AI 辅助</p>
        <div>
            <span class="tag">🏆 传智杯UI一等奖</span>
            <span class="tag">🥈 全国数媒竞赛二等奖</span>
            <span class="tag">🎮 Unity/Unreal 双引擎</span>
        </div>
        <p style="margin-top: 0.8rem;">📧 chenboyan@dmu.edu.cn | 🔗 github.com/boyan-design</p>
    </div>
    
    <!-- Unity WebGL 游戏载体 -->
    <div class="game-wrapper">
        <iframe src="game/index.html" title="陈柏砚 Unity 小游戏" allowfullscreen></iframe>
    </div>
    <div class="footer-note">
        🕹️ 点击游戏区域激活 | 操作：鼠标点击卡片配对 | 独立开发完整交互逻辑
    </div>
</div>
</body>
</html>
